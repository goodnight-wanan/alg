<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="main">
        <div class="content">
            <p>登录xx音乐</p>
            <p>让我们跟随音乐的律动</p>
            <p>一起遨游在自由的海洋吧</p>
        </div>
        <div class="login-container">
            <h2>登录</h2>
            <form>
                <input type="text" placeholder="请输入你的用户名" name="username" required>
                <input type="password" placeholder="请输入你的密码" name="password" required>
    
                <div class="social-login">
                    <button type="button" class="social-button QQ">使用 QQ 登录</button>
                    <button type="button" class="social-button wechat">使用 wechat 登录</button>
                </div>
    
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">我已阅读并同意 <a href="#">用户协议</a></label>
                </div>
    
                <button type="submit">登录</button>
                <a href="#">忘记密码？</a>
                <a href="register.html">注册账号</a>
            </form>
        </div>
    </div>
</body>
</html>
