services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-music_site}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-music_admin} -d ${POSTGRES_DB:-music_site}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_admin}:${POSTGRES_PASSWORD:-music_dev_password}@database:5432/${POSTGRES_DB:-music_site}?schema=public
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_admin}:${POSTGRES_PASSWORD:-music_dev_password}@database:5432/${POSTGRES_DB:-music_site}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      MEDIA_ROOT: /app/uploads
      MAX_AUDIO_UPLOAD_MB: ${MAX_AUDIO_UPLOAD_MB:-50}
      MAX_COVER_UPLOAD_MB: ${MAX_COVER_UPLOAD_MB:-10}
      MAX_AVATAR_UPLOAD_MB: ${MAX_AVATAR_UPLOAD_MB:-1}
      REMOTE_AUDIO_HOSTS: ${REMOTE_AUDIO_HOSTS:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret-change-me}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  seed:
    profiles: ['tools']
    build:
      context: ./server
      target: seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_admin}:${POSTGRES_PASSWORD:-music_dev_password}@database:5432/${POSTGRES_DB:-music_site}?schema=public
      MEDIA_ROOT: /app/uploads
      SEED_FORCE: ${SEED_FORCE:-0}
    volumes:
      - media_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  media_data:
